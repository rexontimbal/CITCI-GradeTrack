# Nginx site config for CITCI GradeTrack (Gunicorn + Nginx target, Ubuntu).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/citci-gradetrack
#   sudo ln -s /etc/nginx/sites-available/citci-gradetrack /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust server_name and the /opt/citci-gradetrack paths to match your
# install. For HTTPS (self-signed or internal-CA cert), see the commented
# block at the bottom and set ENABLE_HTTPS=True in .env to match — see
# docs/DEPLOYMENT.md.

upstream citci_gradetrack {
    server unix:/run/citci-gradetrack/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name gradetrack.citci.local;  # or a LAN IP

    client_max_body_size 20M;  # bulk-import .xlsx uploads can be a few MB

    access_log /var/log/nginx/citci-gradetrack-access.log;
    error_log /var/log/nginx/citci-gradetrack-error.log;

    location /static/ {
        alias /opt/citci-gradetrack/staticfiles/;
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /opt/citci-gradetrack/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://citci_gradetrack;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

