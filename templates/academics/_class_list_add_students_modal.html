{% load sidebar_icons %}
<div class="flex items-center justify-between border-b border-gray-200 pb-3">
    <h3 class="text-base font-semibold text-gray-900">Add Students — {{ class_offering }}</h3>
    <button type="button" @click="modalOpen = false" class="text-gray-400 hover:text-gray-600">
        {% sidebar_icon "close" "w-5 h-5" %}
    </button>
</div>
<form method="post" hx-post="{% url 'academics:class_list_add_students_submit' class_offering.pk %}" hx-target="#modal-content" hx-swap="innerHTML" class="mt-4">
    {% csrf_token %}
    <input type="text" name="q" placeholder="Search students by name or ID number"
           hx-get="{% url 'academics:class_list_add_students_form' class_offering.pk %}" hx-trigger="keyup changed delay:300ms" hx-target="#available-students-list" hx-swap="outerHTML"
           class="mb-2 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand-accent-600 focus:outline-none focus:ring-2 focus:ring-brand-accent-500">
    {% include "academics/_class_list_students_checklist.html" %}
    <div class="mt-4 flex justify-end gap-2">
        <button type="button" @click="modalOpen = false" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
            Cancel
        </button>
        <button type="submit" class="rounded-lg bg-brand-accent-600 px-4 py-2 text-sm font-semibold text-brand-primary-900 hover:bg-brand-accent-700">
            Add Selected
        </button>
    </div>
</form>
