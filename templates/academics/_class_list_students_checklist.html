{% if available_students %}
<div id="available-students-list" class="max-h-72 space-y-1 overflow-y-auto rounded-lg border border-gray-200 p-2">
    {% for student in available_students %}
    <label class="flex items-center gap-2 rounded-lg px-2 py-1.5 text-sm hover:bg-gray-50">
        <input type="checkbox" name="student_ids" value="{{ student.pk }}"
               class="h-4 w-4 rounded border-gray-300 text-brand-accent-600 focus:ring-brand-accent-500">
        <span>{{ student.full_name }}{% if student.id_number %} <span class="text-gray-400">({{ student.id_number }})</span>{% endif %}</span>
    </label>
    {% endfor %}
</div>
{% else %}
<div id="available-students-list" class="rounded-lg border border-gray-200 p-3 text-sm text-gray-500">
    {% if query %}No students match "{{ query }}".{% else %}All students are already on this class's list.{% endif %}
</div>
{% endif %}
