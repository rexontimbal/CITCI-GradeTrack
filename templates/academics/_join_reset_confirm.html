<div class="flex items-center justify-between border-b border-gray-200 pb-3">
    <h3 id="modal-title" class="text-base font-semibold text-gray-900">Reset join code?</h3>
    <button type="button" @click="modalOpen = false" aria-label="Close" class="text-gray-600 hover:text-gray-600">&times;</button>
</div>
<div class="mt-4 space-y-4">
    <p class="text-sm text-gray-600">
        The current code <span class="font-mono font-semibold">{{ class_offering.join_code }}</span> will stop
        working immediately. Students will need the new code (or QR) to join.
    </p>
    <div class="flex justify-end gap-2 pt-2">
        <button type="button" @click="modalOpen = false" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Cancel</button>
        <button hx-post="{{ request.path }}" hx-target="#modal-content" hx-swap="innerHTML"
                class="rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700">
            Reset code
        </button>
    </div>
</div>
