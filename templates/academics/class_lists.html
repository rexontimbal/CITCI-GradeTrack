{% extends "base.html" %}
{% block page_title %}Class Lists{% endblock %}
{% block content %}
{% include "partials/_page_header.html" with title="Class Lists" subtitle="Pick a class to manage its official student list for grading." %}

<div class="mb-4 max-w-md">
    <label class="mb-1 block text-sm font-medium text-gray-700">Class</label>
    <select name="class" hx-get="{% url 'academics:class_lists' %}" hx-target="#roster-container" hx-swap="outerHTML" hx-trigger="change"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand-accent-600 focus:outline-none focus:ring-2 focus:ring-brand-accent-500">
        <option value="">— Select a class —</option>
        {% for c in classes %}
        <option value="{{ c.pk }}" {% if selected_class.pk == c.pk %}selected{% endif %}>{{ c }} ({{ c.semester }})</option>
        {% endfor %}
    </select>
</div>

{% include "academics/_class_list_roster.html" %}
{% endblock %}
