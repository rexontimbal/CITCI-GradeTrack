{% load sidebar_icons %}
<div>
    <div class="flex items-center justify-between border-b border-gray-200 pb-3">
        <h3 id="modal-title" class="text-base font-semibold text-gray-900">Temporary Password</h3>
        <button type="button" @click="modalOpen = false" aria-label="Close" class="text-gray-600 hover:text-gray-600">
            {% sidebar_icon "close" "w-5 h-5" %}
        </button>
    </div>
    <div class="mt-4 space-y-4">
        <div class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-800">
            Shown once — write it down now. {{ user.full_name }} will be asked to change it on first login.
        </div>
        <div x-data="{ copied: false }" class="flex items-center gap-2">
            <code id="temp-password-{{ user.pk }}" class="flex-1 rounded-lg border border-gray-300 bg-gray-50 px-3 py-2 font-mono text-sm text-gray-900">{{ temp_password }}</code>
            <button type="button"
                    @click="navigator.clipboard.writeText('{{ temp_password }}'); copied = true; setTimeout(() => copied = false, 1500)"
                    class="shrink-0 rounded-lg border border-gray-300 px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
                <span x-show="!copied">Copy</span>
                <span x-show="copied" x-cloak>Copied!</span>
            </button>
        </div>
        <div class="flex justify-end pt-2">
            <button type="button" @click="modalOpen = false; htmx.trigger(document.body, '{{ refresh_event }}')"
                    class="rounded-lg bg-brand-accent-600 px-4 py-2 text-sm font-semibold text-brand-primary-900 hover:bg-brand-accent-700">
                Done
            </button>
        </div>
    </div>
</div>
