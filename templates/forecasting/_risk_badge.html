{% if level == "AT_RISK" %}
<span class="inline-block rounded-full bg-red-100 px-2 py-0.5 text-xs font-semibold text-red-700">At Risk</span>
{% elif level == "WATCH" %}
<span class="inline-block rounded-full bg-amber-100 px-2 py-0.5 text-xs font-semibold text-amber-800">Watch</span>
{% elif level == "ON_TRACK" %}
<span class="inline-block rounded-full bg-green-100 px-2 py-0.5 text-xs font-semibold text-green-700">On Track</span>
{% elif level == "not_enough_data" %}
<span class="inline-block rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-600">Not enough data yet</span>
{% elif level == "unavailable" %}
<span class="inline-block rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-600">Forecast unavailable</span>
{% endif %}
