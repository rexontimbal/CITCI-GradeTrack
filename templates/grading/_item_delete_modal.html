{% load sidebar_icons %}
<div class="flex items-center justify-between border-b border-gray-200 pb-3">
    <h3 id="modal-title" class="text-base font-semibold text-gray-900">Delete "{{ item.title }}"?</h3>
    <button type="button" @click="modalOpen = false" aria-label="Close" class="text-gray-600 hover:text-gray-600">
        {% sidebar_icon "close" "w-5 h-5" %}
    </button>
</div>
<form method="post" hx-post="{% url 'grading:item_delete' item.pk %}" hx-target="#modal-content" hx-swap="innerHTML" class="mt-4 space-y-4">
    {% csrf_token %}
    {% if has_scores %}
    <div class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-800">
        Students already have scores recorded on this item. Deleting it will permanently remove those scores too.
    </div>
    <label class="flex items-center gap-2 text-sm text-gray-700">
        <input type="checkbox" name="confirm" value="yes" required class="h-4 w-4 rounded border-gray-300 text-red-600 focus:ring-red-500">
        I understand, delete it anyway.
    </label>
    {% else %}
    <p class="text-sm text-gray-600">This action cannot be undone.</p>
    {% endif %}
    <div class="flex justify-end gap-2 pt-2">
        <button type="button" @click="modalOpen = false" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Cancel</button>
        <button type="submit" class="rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700">Delete</button>
    </div>
</form>
