{% load sidebar_icons %}
<div class="flex items-center justify-between border-b border-gray-200 pb-3">
    <h3 id="modal-title" class="text-base font-semibold text-gray-900">Mark INC: {{ roster_entry.student.full_name }}</h3>
    <button type="button" @click="modalOpen = false" aria-label="Close" class="text-gray-600 hover:text-gray-600">
        {% sidebar_icon "close" "w-5 h-5" %}
    </button>
</div>
<form method="post" hx-post="{% url 'grading:mark_incomplete' roster_entry.pk %}"
      hx-target="#row-{{ roster_entry.pk }}" hx-swap="outerHTML" class="mt-4 space-y-4">
    {% csrf_token %}
    {% if form.non_field_errors %}
    <div class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ form.non_field_errors }}</div>
    {% endif %}
    <label class="flex items-center gap-2 text-sm font-medium text-gray-700">
        {{ form.is_incomplete }} Mark this student's grade as Incomplete (INC)
    </label>
    <div>
        <label for="{{ form.incomplete_reason.id_for_label }}" class="mb-1 block text-sm font-medium text-gray-700">Reason</label>
        {{ form.incomplete_reason }}
        {% for error in form.incomplete_reason.errors %}<p class="mt-1 text-xs text-red-600">{{ error }}</p>{% endfor %}
    </div>
    <div class="flex justify-end gap-2 pt-2">
        <button type="button" @click="modalOpen = false" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Cancel</button>
        <button type="submit" class="rounded-lg bg-brand-accent-600 px-4 py-2 text-sm font-semibold text-brand-primary-900 hover:bg-brand-accent-700">Save</button>
    </div>
</form>
