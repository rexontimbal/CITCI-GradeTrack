{% if status_key == "released" %}
<span class="inline-block rounded-full bg-green-100 px-2 py-0.5 text-xs font-medium text-green-700">{{ status_label }}</span>
{% elif status_key == "in_progress" %}
<span class="inline-block rounded-full bg-blue-100 px-2 py-0.5 text-xs font-medium text-blue-700">{{ status_label }}</span>
{% elif status_key == "inc" %}
<span class="inline-block rounded-full bg-amber-100 px-2 py-0.5 text-xs font-medium text-amber-800">{{ status_label }}</span>
{% elif status_key == "dropped" %}
<span class="inline-block rounded-full bg-gray-200 px-2 py-0.5 text-xs font-medium text-gray-600">{{ status_label }}</span>
{% else %}
<span class="inline-block rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-600">{{ status_label }}</span>
{% endif %}
