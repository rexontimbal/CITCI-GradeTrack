{% load sidebar_icons %}
<div class="flex flex-col items-center justify-center rounded-2xl border border-dashed border-gray-300 bg-white px-6 py-16 text-center">
    <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-xl bg-brand-accent-100 text-brand-accent-900">
        {% sidebar_icon icon|default:"document" "w-7 h-7" %}
    </div>
    <h3 class="text-base font-semibold text-gray-900">{{ title|default:"Coming soon" }}</h3>
    <p class="mt-1 max-w-sm text-sm text-gray-500">{{ description|default:"This feature will be built in a later phase of CITCI GradeTrack." }}</p>
</div>
