{% if messages %}
<div id="django-messages" class="hidden">
    {% for message in messages %}
    <span data-message="{{ message }}" data-level="{{ message.tags }}"></span>
    {% endfor %}
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const LEVELS = { error: "error", success: "success", warning: "warning" };
        document.querySelectorAll("#django-messages [data-message]").forEach((el) => {
            window.dispatchEvent(new CustomEvent("toast", {
                detail: { message: el.dataset.message, level: LEVELS[el.dataset.level] || "info" },
            }));
        });
    });
</script>
{% endif %}
