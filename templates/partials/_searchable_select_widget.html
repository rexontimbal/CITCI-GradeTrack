<div x-data="searchableSelect('{{ selected_value }}', '{{ selected_label|escapejs }}')" class="relative" @click.outside="open = false">
    <input type="hidden" name="{{ widget_name }}" :value="value">
    <input type="text" x-model="query" autocomplete="off" placeholder="Search…"
           @focus="open = true" @keydown="onKeydown($event)"
           hx-get="{{ search_url }}" hx-trigger="keyup changed delay:300ms, focus" hx-target="#{{ widget_id }}-results" hx-swap="innerHTML"
           name="q"
           class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand-accent-600 focus:outline-none focus:ring-2 focus:ring-brand-accent-500">
    <div x-show="open" x-cloak x-ref="list" id="{{ widget_id }}-results"
         class="absolute z-20 mt-1 max-h-56 w-full overflow-y-auto rounded-lg border border-gray-200 bg-white shadow-lg"></div>
</div>
