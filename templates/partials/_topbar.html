{% load sidebar_icons %}
<header class="flex items-center justify-between gap-3 bg-white px-4 py-3 shadow-sm md:px-6">
    <div class="flex items-center gap-3">
        <button type="button" @click="mobileOpen = true" class="flex h-9 w-9 items-center justify-center rounded-lg text-gray-600 hover:bg-gray-100 md:hidden">
            {% sidebar_icon "menu" "w-5 h-5" %}
        </button>
        <div>
            <h1 class="text-base font-semibold text-gray-900 md:text-lg">{% block topbar_title %}{{ page_title|default:"Dashboard" }}{% endblock %}</h1>
            <p class="text-xs text-gray-500">1st Sem, A.Y. 2026–2027</p>
        </div>
    </div>

    <div class="flex items-center gap-3">
        <button type="button" title="Notifications" class="relative flex h-9 w-9 items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100">
            {% sidebar_icon "bell" "w-5 h-5" %}
        </button>
        <div class="hidden items-center gap-2 border-l border-gray-200 pl-3 sm:flex">
            <div class="flex h-8 w-8 items-center justify-center rounded-full bg-brand-primary-100 text-xs font-bold text-brand-primary-700">
                {{ user.initials }}
            </div>
            <div class="leading-tight">
                <p class="text-sm font-medium text-gray-900">{{ user.full_name }}</p>
                <span class="inline-block rounded-full bg-brand-accent-100 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-brand-accent-900">
                    {{ user.get_role_display }}
                </span>
            </div>
        </div>
    </div>
</header>
